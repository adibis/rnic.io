baseURL: https://rnic.io/
locale: en-us
title: RNIC
theme: hextra

enableRobotsTXT: true
enableGitInfo: true

params:
  description: "A definitive, datasheet-depth guide to RDMA-capable NIC architecture: RoCEv2 wire format, Queue Pair management, memory registration, and every hardware structure between a WQE and the wire."
  images:
    - "images/og-card.png"

  author:
    name: Aditya Shevade

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  imageZoom:
    enable: true

  # TODO: verify this is the actual public repo once rnic.io is pushed to
  # GitHub -- placeholder matching chipdv.io's naming convention.
  reportIssue:
    enable: true
    repo: "https://github.com/adibis/rnic.io"

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"

  comments:
    enable: false # site-wide default stays off; content/blog/_index.md's
                  # cascade turns this on for blog posts only, never for
                  # book chapters.
    type: giscus
    # giscus:
    #   repo: "adibis/rnic.io"
    #   repoId: ""
    #   category: ""
    #   categoryId: ""
    # TODO: uncomment and fill in once rnic.io is pushed to GitHub,
    # Discussions is enabled, the giscus GitHub App is installed, and
    # https://giscus.app's config tool has generated real repoId/
    # categoryId values. Until then this fails safe at build time
    # ("giscus is not configured"), not a broken widget in production.


menu:
  main:
    - name: RDMA
      pageRef: /overview/
      weight: 1
    - name: Blog
      pageRef: /blog
      weight: 2
    - name: About
      pageRef: /about
      weight: 3
    - name: search
      weight: 4
      params:
        type: search
    - name: theme-toggle
      weight: 5
      params:
        type: theme-toggle

markup:
  highlight:
    noClasses: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true
