baseURL: https://rnic.io/
locale: en-us
title: RNIC
theme: hextra

enableRobotsTXT: true
enableGitInfo: true

params:
  description: "A definitive, datasheet-depth guide to RDMA-capable NIC architecture: RoCEv2 wire format, Queue Pair management, memory registration, and every hardware structure between a WQE and the wire."
  images:
    - "images/og-card.png"

  author:
    name: Aditya Shevade

  navbar:
    displayTitle: true
    displayLogo: false
    width: wide

  page:
    width: wide

  theme:
    default: light
    displayToggle: true

  footer:
    displayCopyright: false
    displayPoweredBy: false

  imageZoom:
    enable: true

  # TODO: verify this is the actual public repo once rnic.io is pushed to
  # GitHub -- placeholder matching chipdv.io's naming convention.
  reportIssue:
    enable: true
    repo: "https://github.com/adibis/rnic.io"

  displayUpdatedDate: true
  dateFormat: "January 2, 2006"


menu:
  main:
    - name: RDMA
      pageRef: /overview/
      weight: 1
    - name: About
      pageRef: /about
      weight: 2
    - name: search
      weight: 3
      params:
        type: search
    - name: theme-toggle
      weight: 4
      params:
        type: theme-toggle

markup:
  highlight:
    noClasses: false
    style: monokai
  goldmark:
    renderer:
      unsafe: true
