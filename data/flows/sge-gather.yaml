title: "Gathering one SEND from three buffers"
diagram: flows/sge-walk
play: "Play the gather"
description: >-
  A 7,680-byte SEND whose WQE names three buffers in two Memory Regions, at
  a 4,096-byte path MTU. The gather cursor fills each packet from wherever
  the last one stopped, translating each SGE on its own, so the packet
  boundary falls in the middle of a buffer.
steps:
  - scene: "The WQE"
    caption: >-
      Software posts a SEND whose payload is spread over three buffers: 1 KiB
      and 512 B in MR 1, 6 KiB in MR 2. That is 7,680 bytes, far too many to
      copy into the WQE inline, so the DMA engine has to fetch them.
    lit: [block-a-sge0, block-a-sge1, block-a-sge2, block-r-a0, block-r-a1, block-r-a2]
    state: &g0
      label: "Gather cursor"
      fields:
        - [SGE, "0"]
        - [offset in SGE, "0"]
        - [message bytes left, "7,680"]
        - [this packet, "not started"]
    chapter: /tx/the-wqe-and-the-send-queue-descriptor

  - predict: >-
      The path MTU is 4,096 bytes. How many packets, and where does the
      first one end?
    caption: >-
      Two. Each packet takes the path MTU or whatever is left, whichever is
      smaller: 4,096 bytes now, 3,584 next. The first packet ends 3,072
      bytes into SGE 1. The packet boundary and the buffer boundaries have
      nothing to do with each other.
    lit: [block-a-gather, block-r-p0, block-r-p1]
    state: &g1
      label: "Gather cursor"
      fields:
        - [SGE, "0"]
        - [offset in SGE, "0"]
        - [message bytes left, "7,680"]
        - [this packet, "SEND_FIRST, 0 of 4,096"]
    chapter: /dma/the-gather-path

  - scene: "Packet 1"
    caption: >-
      The cursor is on SGE 0, so its lkey is translated first: does MR 1
      exist, may this QP's protection domain read it, and where is 1 KiB at
      that address physically?
    lit: [block-a-xlate, block-a-gather, block-a-sge0]
    travel: arrow-a-xlate
    token: "lkey 0x1001"
    state: *g1
    chapter: /dma/address-translation-handoff

  - caption: >-
      All of SGE 0 fits, so all 1,024 bytes are read. The cursor runs off
      the end of SGE 0 and moves to SGE 1, offset 0.
    lit: [block-a-sge0, block-a-gather, block-r-a0, block-r-p0]
    travel: arrow-a-read0
    token: "1,024 B"
    state: &g2
      label: "Gather cursor"
      fields:
        - [SGE, "1"]
        - [offset in SGE, "0"]
        - [message bytes left, "6,656"]
        - [this packet, "SEND_FIRST, 1,024 of 4,096"]

  - caption: >-
      SGE 1 is a different region with a different lkey, so it needs its
      own lookup. Even SGE 2, which is in MR 1 again, will get its own: a
      translation belongs to a segment, not to the operation.
    lit: [block-a-xlate, block-a-gather, block-a-sge1]
    travel: arrow-a-xlate
    token: "lkey 0x2002"
    state: *g2
    chapter: /dma/address-translation-handoff

  - predict: >-
      The packet has room for 3,072 more bytes and SGE 1 holds 6,144. Where
      does the cursor stop?
    caption: >-
      At offset 3,072 inside SGE 1. Only what fits is read; the cursor keeps
      its place so the next packet can resume there.
    lit: [block-a-sge1, block-a-gather, block-r-a1, block-r-p0]
    travel: arrow-a-read1
    token: "3,072 B"
    state: &g3
      label: "Gather cursor"
      fields:
        - [SGE, "1"]
        - [offset in SGE, "3,072"]
        - [message bytes left, "3,584"]
        - [this packet, "SEND_FIRST, full"]
    chapter: /dma/in-flight-transfer-state

  - caption: >-
      The full payload goes to TX Packet Build, which puts the headers in
      front and the ICRC behind.
    lit: [block-a-gather, block-a-build, block-r-p0]
    travel: arrow-a-gb
    packet:
      label: "SEND_FIRST  PSN 100"
      headers:
        - name: BTH
          fields:
            - [OpCode, "0x00  RC SEND First"]
            - [DestQP, "0x000012"]
            - [AckReq, "0"]
            - [PSN, "100"]
        - name: Payload
          fields:
            - [Bytes, "4,096: SGE 0, then SGE 1 up to 3,072"]
    state: *g3
    chapter: /tx/tx-packet-build

  - scene: "Packet 2"
    caption: >-
      The next packet starts where the cursor stopped. SGE 1's lkey is
      looked up again for this packet; the Key Cache is what makes a repeat
      lookup cheap.
    lit: [block-a-xlate, block-a-gather, block-a-sge1]
    travel: arrow-a-xlate
    token: "lkey 0x2002"
    state: &g4
      label: "Gather cursor"
      fields:
        - [SGE, "1"]
        - [offset in SGE, "3,072"]
        - [message bytes left, "3,584"]
        - [this packet, "SEND_LAST, 0 of 3,584"]
    chapter: /mr/key-caching

  - caption: >-
      The rest of SGE 1, 3,072 bytes, is read, and the cursor moves to
      SGE 2.
    lit: [block-a-sge1, block-a-gather, block-r-a1, block-r-p1]
    travel: arrow-a-read1
    token: "3,072 B"
    state: &g5
      label: "Gather cursor"
      fields:
        - [SGE, "2"]
        - [offset in SGE, "0"]
        - [message bytes left, "512"]
        - [this packet, "SEND_LAST, 3,072 of 3,584"]

  - caption: >-
      SGE 2 is translated and its 512 bytes read. Bytes left reaches zero
      exactly as the cursor reaches the end of the last SGE.
    lit: [block-a-xlate, block-a-sge2, block-a-gather, block-r-a2, block-r-p1]
    travel: [arrow-a-xlate, arrow-a-read2]
    token: ["lkey 0x1001", "512 B"]
    state: &g6
      label: "Gather cursor"
      fields:
        - [SGE, "2"]
        - [offset in SGE, "512, the end"]
        - [message bytes left, "0"]
        - [this packet, "SEND_LAST, full"]

  - caption: >-
      The last packet of the message carries AckReq, so the receiver will
      answer once both packets are in.
    lit: [block-a-gather, block-a-build, block-r-p1]
    travel: arrow-a-gb
    packet:
      label: "SEND_LAST  PSN 101"
      headers:
        - name: BTH
          fields:
            - [OpCode, "0x02  RC SEND Last"]
            - [DestQP, "0x000012"]
            - [AckReq, "1"]
            - [PSN, "101"]
        - name: Payload
          fields:
            - [Bytes, "3,584: rest of SGE 1, then SGE 2"]
    state: *g6
    chapter: /tx/response-generation

  - caption: >-
      Both packets leave. NIC B sees two packets and nothing of the three
      buffers they came from; how they land is up to NIC B's own SGE list.
    lit: [block-a-build, block-b-psn, block-r-p0, block-r-p1]
    travel: arrow-wire
    token: "PSN 100, 101"
    state: *g6
    chapter: /dma/the-scatter-path
