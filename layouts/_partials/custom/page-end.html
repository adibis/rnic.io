<script>
  (function () {
    // Runs on every class change on <html>, not only theme toggles (the
    // flow player marks the page while it is open), so it must leave an
    // already-dark source alone.
    function darkSrc(src) {
      if (/-dark\.svg(\?.*)?$/.test(src)) return src;
      return src.replace(/\.svg(\?.*)?$/, "-dark.svg$1");
    }
    function lightSrc(src) {
      return src.replace(/-dark\.svg(\?.*)?$/, ".svg$1");
    }
    function syncDiagrams() {
      var dark = document.documentElement.classList.contains("dark");
      // Work on the attribute, not img.src: the property resolves to an
      // absolute URL, and writing that back would stop the selector above
      // matching on the next toggle.
      document.querySelectorAll('img[src^="/images/"]').forEach(function (img) {
        var src = img.getAttribute("src");
        var next = dark ? darkSrc(src) : lightSrc(src);
        if (next !== src) img.setAttribute("src", next);
      });
    }
    syncDiagrams();
    new MutationObserver(syncDiagrams).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ["class"],
    });
  })();
</script>
